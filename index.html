<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook → Python Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Limelight&family=Cinzel:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── Decoplex: 1990s multiplex Art-Deco revival ─────────────────────
     midnight jewel-tone ground · gold hairlines · sunburst · chevrons
     Display: Limelight / Poiret One (marquee only)
     Body:    Jost — geometric sans, same Futura lineage, legible at 14px
     Utility: Cinzel — controls and labels                              */
  :root {
    --ink:      #0a0f1f;   /* deep midnight */
    --ink-2:    #111a33;
    --panel:    #14203f;   /* jewel navy */
    --panel-2:  #1b2b52;
    --gold:     #e8c169;   /* brass / marquee gold */
    --gold-hi:  #f6de9a;
    --teal:     #37b7b0;   /* neon teal */
    --magenta:  #e0508a;   /* neon magenta */
    --text:     #f3ecdb;   /* warm ivory */
    --muted:    #a8b2cc;
    --danger:   #ff6f6f;
    --warn:     #f0b45c;
    --line:     rgba(232,193,105,.35);
    --line-soft:rgba(232,193,105,.16);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Jost", "Century Gothic", system-ui, sans-serif;
    font-weight: 300;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(224,80,138,.10), transparent 55%),
      radial-gradient(120% 90% at 50% 0%, rgba(55,183,176,.10), transparent 50%),
      linear-gradient(180deg, var(--ink-2), var(--ink) 60%);
    color: var(--text);
    line-height: 1.55;
    padding: 2rem 1rem 3rem;
    min-height: 100vh;
  }
  /* Sunburst rays radiating from the top-center — the marquee halo */
  body::before {
    content: "";
    position: fixed; inset: -30% 0 auto 0; height: 70vh; z-index: 0;
    background: repeating-conic-gradient(from 90deg at 50% 0%,
      rgba(232,193,105,.06) 0deg 3deg, transparent 3deg 9deg);
    -webkit-mask-image: radial-gradient(80% 100% at 50% 0%, #000 0%, transparent 70%);
            mask-image: radial-gradient(80% 100% at 50% 0%, #000 0%, transparent 70%);
    pointer-events: none;
  }
  .wrap { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }

  /* ── Header / marquee ── */
  header { text-align: center; margin-bottom: 2rem; }
  .sunburst {
    width: 48px; height: 48px; margin: 0 auto .5rem;
    background: radial-gradient(circle at 50% 50%, var(--gold-hi) 0 14%, transparent 15%), var(--gold);
    -webkit-mask: repeating-conic-gradient(from 0deg, #000 0 9deg, transparent 9deg 18deg);
            mask: repeating-conic-gradient(from 0deg, #000 0 9deg, transparent 9deg 18deg);
    filter: drop-shadow(0 0 10px rgba(232,193,105,.4));
  }
  h1 {
    font-family: "Limelight", "Cinzel", serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 5.5vw, 2.5rem);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin: .1rem 0 .6rem;
    color: var(--gold-hi);
    text-shadow: 0 1px 0 rgba(0,0,0,.5), 0 0 22px rgba(232,193,105,.25);
  }
  .rule {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    margin: 0 auto .7rem; max-width: 360px; color: var(--gold);
  }
  .rule::before, .rule::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .rule::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .rule .diamond { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
  .sub {
    font-family: "Poiret One", "Jost", sans-serif;
    color: var(--text); margin: 0; font-size: 1.15rem; letter-spacing: .05em;
  }
  code { font-family: var(--mono); color: var(--teal); font-size: .88em; }

  /* ── Drop zone: framed marquee panel with stepped corners ── */
  .drop {
    display: block; position: relative;
    border: 1px solid var(--line);
    outline: 1px solid var(--line-soft); outline-offset: 5px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%),
      var(--panel);
    padding: 2.75rem 1.5rem;
    text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .drop:hover, .drop.drag, .drop:focus-within {
    border-color: var(--gold);
    background: var(--panel-2);
    box-shadow: 0 0 0 1px var(--gold-hi) inset, 0 0 30px rgba(232,193,105,.12);
  }
  /* keyboard focus needs to be unmistakable, not just the hover treatment */
  .drop:focus-within { outline: 2px solid var(--teal); outline-offset: 4px; }
  /* gold stepped-ziggurat corner ticks */
  .drop::before, .drop::after {
    content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none;
  }
  .drop::before { top: -1px; left: -1px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .drop::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }
  .drop .icon { font-size: 2.4rem; filter: drop-shadow(0 0 8px rgba(232,193,105,.35)); }
  .drop .big {
    font-family: "Cinzel", serif; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold-hi); margin-top: .6rem; font-size: 1.02rem;
  }
  .drop .small { color: var(--muted); font-size: .95rem; margin-top: .35rem; letter-spacing: .02em; }
  /* visually hidden but still focusable and still in the tab order */
  .vh {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ── Options ── */
  fieldset { border: 0; margin: 1.5rem 0 .5rem; padding: 0; }
  legend {
    font-family: "Cinzel", serif; font-weight: 600; font-size: .72rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
    padding: 0; margin-bottom: .8rem;
  }
  .opts {
    display: flex; flex-wrap: wrap; gap: .9rem 1.6rem;
    color: var(--text); font-size: .95rem; letter-spacing: .02em;
  }
  .opts label { display: flex; align-items: center; gap: .5rem; cursor: pointer; }
  .opts input { accent-color: var(--teal); width: 16px; height: 16px; flex: none; }
  .opts input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ── Buttons ── */
  .toolbar { display: flex; gap: .7rem; margin: 1.4rem 0 .5rem; flex-wrap: wrap; }
  button {
    font-family: "Cinzel", serif; font-weight: 600; font-size: .86rem;
    letter-spacing: .09em; text-transform: uppercase;
    border: none; padding: .7rem 1.25rem; cursor: pointer;
    transition: transform .12s, box-shadow .15s, filter .15s, opacity .15s, background .15s;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-primary {
    color: #1c1405;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold));
    box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset, 0 4px 14px rgba(232,193,105,.25);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
  .btn-ghost {
    background: transparent; color: var(--gold-hi);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--gold); background: rgba(232,193,105,.08); }

  /* ── Status line (announced to screen readers) ── */
  .status {
    min-height: 1.4rem; font-size: .92rem; color: var(--muted);
    letter-spacing: .02em; margin-bottom: .5rem;
  }
  .status.err  { color: var(--danger); }
  .status.ok   { color: var(--teal); }

  /* ── File cards ── */
  .file {
    background: var(--panel); border: 1px solid var(--line-soft);
    margin-bottom: 1rem; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .file-head {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding: .8rem 1rem; background: var(--panel-2);
    border-bottom: 1px solid var(--line-soft);
  }
  .file-name {
    font-family: "Cinzel", serif; font-weight: 600; letter-spacing: .03em;
    word-break: break-all; flex: 1 1 12rem; color: var(--gold-hi);
  }
  .file-meta {
    color: var(--muted); font-size: .84rem; letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .file-meta.bad { color: var(--danger); }
  .file-note {
    font-size: .88rem; padding: .5rem 1rem; letter-spacing: .02em;
    border-bottom: 1px solid var(--line-soft);
  }
  .file-note.err  { color: var(--danger); border-bottom: 0; }
  .file-note.warn { color: var(--warn); }
  .file-note.empty { color: var(--muted); border-bottom: 0; }
  pre {
    margin: 0; padding: 1rem; max-height: 320px; overflow: auto;
    font-family: var(--mono);
    font-size: .82rem; line-height: 1.5; white-space: pre;
    background: rgba(6,10,22,.6); color: var(--text);
    tab-size: 4;
  }
  pre:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
  .file-actions {
    padding: .65rem 1rem; border-top: 1px solid var(--line-soft);
    display: flex; gap: .5rem; flex-wrap: wrap;
  }
  .file-actions button { padding: .45rem .85rem; font-size: .74rem; }

  /* zigzag chevron divider */
  .chevrons {
    height: 12px; margin: .25rem auto 1.75rem; max-width: 320px;
    background: var(--line);
    -webkit-mask: repeating-conic-gradient(from -45deg at 50% 0, #000 0 90deg, transparent 90deg 180deg);
            mask: repeating-conic-gradient(from -45deg at 50% 0, #000 0 90deg, transparent 90deg 180deg);
    -webkit-mask-size: 12px 12px; mask-size: 12px 12px;
  }
  a { color: var(--teal); }
  ::selection { background: rgba(224,80,138,.4); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .btn-primary:hover:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sunburst" aria-hidden="true"></div>
    <h1>Notebook &#8250; Python</h1>
    <div class="rule" aria-hidden="true"><span class="diamond"></span></div>
    <p class="sub">Drop <code>.ipynb</code> files below to extract their Python source.</p>
  </header>

  <label class="drop" id="drop">
    <div class="icon" aria-hidden="true">📓</div>
    <div class="big">Choose files, or drag &amp; drop</div>
    <div class="small">Select as many <code>.ipynb</code> files as you like</div>
    <input class="vh" type="file" id="fileInput" accept=".ipynb,application/x-ipynb+json" multiple>
  </label>

  <fieldset>
    <legend>Include in output</legend>
    <div class="opts">
      <label><input type="checkbox" id="optMarkdown"> Markdown, as comments</label>
      <label><input type="checkbox" id="optOutputs"> Printed output and errors</label>
      <label><input type="checkbox" id="optCellNums"> Cell separators</label>
      <label><input type="checkbox" id="optMagics"> IPython magics (<code>%</code>, <code>!</code>)</label>
    </div>
  </fieldset>

  <div class="toolbar">
    <button class="btn-primary" id="copyAll" disabled>Copy all for LLM</button>
    <button class="btn-ghost" id="downloadAll" disabled>Download all</button>
    <button class="btn-ghost" id="clearAll" disabled>Clear</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="chevrons" aria-hidden="true"></div>
  <div id="results"></div>
</div>

<script>
(function () {
  "use strict";

  var MAX_BYTES = 25 * 1024 * 1024; // notebooks with embedded plots get huge
  var ANSI = /\u001b\[[0-9;]*[A-Za-z]/g;

  var fileInput    = document.getElementById("fileInput");
  var drop         = document.getElementById("drop");
  var results      = document.getElementById("results");
  var statusEl     = document.getElementById("status");
  var downloadAllBtn = document.getElementById("downloadAll");
  var copyAllBtn   = document.getElementById("copyAll");
  var clearAllBtn  = document.getElementById("clearAll");
  var optMarkdown  = document.getElementById("optMarkdown");
  var optOutputs   = document.getElementById("optOutputs");
  var optCellNums  = document.getElementById("optCellNums");
  var optMagics    = document.getElementById("optMagics");

  // Parsed notebooks, kept so options changes re-render without re-reading.
  // { name, notebook|null, error, language, py, pyName }
  var items = [];

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function srcToText(source) {
    if (Array.isArray(source)) return source.join("");
    if (typeof source === "string") return source;
    return "";
  }

  /* Which line starts sit outside a string literal?
     Cheap Python scanner: tracks quote state and end-of-line comments so a
     line beginning with "!" inside a docstring is left alone. */
  function topLevelLineStarts(text) {
    var lines = text.split("\n");
    var atTop = [];
    var delim = null;
    for (var i = 0; i < lines.length; i++) {
      atTop.push(delim === null);
      var line = lines[i], j = 0;
      while (j < line.length) {
        var c = line.charAt(j);
        if (delim) {
          if (c === "\\") { j += 2; continue; }
          if (line.substr(j, delim.length) === delim) { j += delim.length; delim = null; continue; }
          j++; continue;
        }
        if (c === "#") break;
        if (c === '"' || c === "'") {
          var triple = c + c + c;
          if (line.substr(j, 3) === triple) { delim = triple; j += 3; }
          else { delim = c; j++; }
          continue;
        }
        j++;
      }
      if (delim && delim.length === 1) delim = null; // single quotes don't span lines
    }
    return atTop;
  }

  function commentMagics(code) {
    var lines = code.split("\n");
    var firstIdx = -1;
    for (var k = 0; k < lines.length; k++) {
      if (lines[k].trim() !== "") { firstIdx = k; break; }
    }
    // A cell magic (%%bash, %%html) means the WHOLE cell isn't Python.
    if (firstIdx !== -1 && lines[firstIdx].replace(/^\s+/, "").indexOf("%%") === 0) {
      return lines.map(function (l) {
        return l.trim() === "" ? l : "# " + l;
      }).join("\n");
    }
    var atTop = topLevelLineStarts(code);
    return lines.map(function (l, i) {
      if (!atTop[i]) return l;
      var t = l.replace(/^\s+/, "");
      if (t.charAt(0) === "%" || t.charAt(0) === "!" || t.charAt(0) === "?") return "# " + l;
      return l;
    }).join("\n");
  }

  function commentBlock(text, prefix) {
    return text.replace(/\s+$/, "").split("\n").map(function (l) {
      return prefix + l;
    }).join("\n");
  }

  /* Tracebacks and stderr are usually the most useful thing in a notebook
     you're handing to a model, so they're kept verbatim (minus ANSI codes). */
  function outputsToText(outputs) {
    var parts = [];
    (outputs || []).forEach(function (out) {
      if (out.output_type === "stream") {
        var txt = srcToText(out.text).replace(ANSI, "");
        if (txt.trim()) {
          parts.push(commentBlock(txt, out.name === "stderr" ? "#! " : "#> "));
        }
      } else if (out.output_type === "error") {
        var tb = (out.traceback || []).join("\n").replace(ANSI, "");
        var head = (out.ename || "Error") + ": " + (out.evalue || "");
        parts.push(commentBlock(tb.trim() ? tb : head, "#! "));
      } else if (out.output_type === "execute_result" || out.output_type === "display_data") {
        var plain = out.data && out.data["text/plain"];
        var t = srcToText(plain).replace(ANSI, "");
        if (t.trim()) parts.push(commentBlock(t, "#> "));
      }
    });
    return parts.join("\n");
  }

  function convert(notebook) {
    var cells = (notebook && notebook.cells) || [];
    var parts = [];
    var codeIdx = 0;

    cells.forEach(function (cell) {
      if (cell.cell_type === "code") {
        codeIdx++;
        var code = srcToText(cell.source).replace(/\s+$/, "");
        if (!optMagics.checked) code = commentMagics(code);
        var outs = optOutputs.checked ? outputsToText(cell.outputs) : "";
        if (!code.trim() && !outs) return;
        if (optCellNums.checked) parts.push("# %% [code] cell " + codeIdx);
        if (code.trim()) parts.push(code);
        if (outs) parts.push(outs);
      } else if (cell.cell_type === "markdown" && optMarkdown.checked) {
        var md = srcToText(cell.source).replace(/\s+$/, "");
        if (!md.trim()) return;
        if (optCellNums.checked) parts.push("# %% [markdown]");
        parts.push(commentBlock(md, "# "));
      }
    });

    return parts.length ? parts.join("\n\n") + "\n" : "";
  }

  function pyFileName(name) {
    return name.replace(/\.ipynb$/i, "").replace(/[^\w.\-]+/g, "_") + ".py";
  }

  function fmtCount(n) {
    return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: "text/x-python;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* Clipboard API needs a secure context and permission; opened from
     file:// it rejects silently, so fall back and report honestly. */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      ok ? resolve() : reject(new Error("copy blocked"));
    });
  }

  function flash(btn, label) {
    var orig = btn.dataset.label || btn.textContent;
    btn.dataset.label = orig;
    btn.textContent = label;
    setTimeout(function () { btn.textContent = btn.dataset.label; }, 1600);
  }

  function makeBtn(label, onClick) {
    var b = document.createElement("button");
    b.className = "btn-ghost";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function render() {
    results.innerHTML = "";
    var anyOk = false;

    items.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "file";

      var head = document.createElement("div");
      head.className = "file-head";
      var nameEl = document.createElement("div");
      nameEl.className = "file-name";
      nameEl.textContent = item.name;
      head.appendChild(nameEl);

      var meta = document.createElement("div");
      meta.className = "file-meta";
      head.appendChild(meta);
      card.appendChild(head);

      if (item.error) {
        meta.classList.add("bad");
        meta.textContent = "not converted";
        var err = document.createElement("div");
        err.className = "file-note err";
        err.textContent = item.error;
        card.appendChild(err);
        card.appendChild(actionsFor(item, null));
        results.appendChild(card);
        return;
      }

      item.py = convert(item.notebook);
      item.pyName = pyFileName(item.name);

      if (item.language && item.language !== "python") {
        var warn = document.createElement("div");
        warn.className = "file-note warn";
        warn.textContent = "Kernel language is " + item.language +
          ", not Python. The extracted source won't be valid Python.";
        card.appendChild(warn);
      }

      if (!item.py) {
        meta.textContent = "nothing to extract";
        var empty = document.createElement("div");
        empty.className = "file-note empty";
        empty.textContent = "No code cells with content. Turn on markdown or output " +
          "above if you want the surrounding text instead.";
        card.appendChild(empty);
        card.appendChild(actionsFor(item, null));
        results.appendChild(card);
        return;
      }

      anyOk = true;
      var lines = item.py.replace(/\n$/, "").split("\n").length;
      meta.textContent = lines + " lines · ~" + fmtCount(Math.ceil(item.py.length / 4)) +
        " tokens · " + item.pyName;

      var pre = document.createElement("pre");
      pre.tabIndex = 0;
      pre.textContent = item.py;
      card.appendChild(pre);
      card.appendChild(actionsFor(item, item.py));

      results.appendChild(card);
    });

    downloadAllBtn.disabled = !anyOk;
    copyAllBtn.disabled = !anyOk;
    clearAllBtn.disabled = items.length === 0;
  }

  function actionsFor(item, py) {
    var actions = document.createElement("div");
    actions.className = "file-actions";
    if (py) {
      actions.appendChild(makeBtn("Download " + item.pyName, function () {
        download(item.pyName, py);
      }));
      var copy = makeBtn("Copy", function () {
        copyText(py).then(function () {
          flash(copy, "Copied ✓");
        }, function () {
          flash(copy, "Copy blocked");
          setStatus("The browser blocked clipboard access. Select the code and copy it manually, or use Download.", "err");
        });
      });
      actions.appendChild(copy);
    }
    actions.appendChild(makeBtn("Remove", function () {
      items = items.filter(function (x) { return x !== item; });
      render();
      setStatus("Removed " + item.name + ".");
    }));
    return actions;
  }

  function readOne(file) {
    return new Promise(function (resolve) {
      if (file.size > MAX_BYTES) {
        resolve({
          name: file.name,
          error: "File is " + Math.round(file.size / 1048576) + " MB, over the 25 MB limit. " +
                 "Clear the notebook's outputs and try again."
        });
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var item = { name: file.name };
        try {
          var nb = JSON.parse(reader.result);
          if (!nb || !Array.isArray(nb.cells)) {
            throw new Error("no 'cells' array — this isn't notebook JSON");
          }
          item.notebook = nb;
          var ks = nb.metadata && nb.metadata.kernelspec;
          if (ks && ks.language) item.language = String(ks.language).toLowerCase();
        } catch (e) {
          item.error = "Couldn't read the notebook: " + e.message;
        }
        resolve(item);
      };
      reader.onerror = function () {
        resolve({ name: file.name, error: "The file couldn't be read." });
      };
      reader.readAsText(file);
    });
  }

  function handleFiles(fileList) {
    var all = Array.from(fileList);
    var files = all.filter(function (f) { return /\.ipynb$/i.test(f.name); });
    var skipped = all.length - files.length;

    if (files.length === 0) {
      setStatus(all.length
        ? "Those aren't notebooks. This takes .ipynb files only."
        : "Nothing landed — try selecting the files instead of dragging a folder.", "err");
      return;
    }

    setStatus("Reading " + files.length + " file" + (files.length === 1 ? "" : "s") + "…");

    // Read in parallel but keep selection order — results are slotted by index.
    Promise.all(files.map(readOne)).then(function (parsed) {
      parsed.forEach(function (item) {
        var at = -1;
        for (var i = 0; i < items.length; i++) {
          if (items[i].name === item.name) { at = i; break; }
        }
        if (at >= 0) items[at] = item; else items.push(item);
      });
      render();
      var failed = parsed.filter(function (p) { return p.error; }).length;
      var msg = "Converted " + (parsed.length - failed) + " of " + parsed.length + ".";
      if (skipped) msg += " Skipped " + skipped + " non-notebook file" + (skipped === 1 ? "" : "s") + ".";
      setStatus(msg, failed ? "err" : "ok");
    });
  }

  fileInput.addEventListener("change", function () {
    handleFiles(fileInput.files);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault();
      drop.classList.add("drag");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault();
      drop.classList.remove("drag");
    });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  downloadAllBtn.addEventListener("click", function () {
    var ready = items.filter(function (i) { return !i.error && i.py; });
    ready.forEach(function (item, i) {
      // Stagger so browsers don't drop concurrent downloads.
      setTimeout(function () { download(item.pyName, item.py); }, i * 150);
    });
    setStatus("Downloading " + ready.length + " file" + (ready.length === 1 ? "" : "s") + ".", "ok");
  });

  copyAllBtn.addEventListener("click", function () {
    var blocks = items
      .filter(function (item) { return !item.error && item.py; })
      .map(function (item) {
        return "# ===== " + item.name + " =====\n\n" + item.py.replace(/\s+$/, "");
      });
    var combined = blocks.join("\n\n\n") + "\n";
    copyText(combined).then(function () {
      flash(copyAllBtn, "Copied " + blocks.length + " file" + (blocks.length === 1 ? "" : "s") + " ✓");
      setStatus("Copied " + blocks.length + " file" + (blocks.length === 1 ? "" : "s") +
        " · ~" + fmtCount(Math.ceil(combined.length / 4)) + " tokens.", "ok");
    }, function () {
      flash(copyAllBtn, "Copy blocked");
      setStatus("The browser blocked clipboard access. Use Download all instead, or open this page over https.", "err");
    });
  });

  clearAllBtn.addEventListener("click", function () {
    items = [];
    render();
    setStatus("Cleared.");
  });

  [optMarkdown, optOutputs, optCellNums, optMagics].forEach(function (el) {
    el.addEventListener("change", render);
  });
})();
</script>
</body>
</html>
